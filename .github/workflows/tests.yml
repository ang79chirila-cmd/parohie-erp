name: Teste automate

# Rulează automat de fiecare dată când se încarcă cod nou pe master, sau la orice pull request
# către master — fără nicio acțiune suplimentară din partea ta. Dacă vreo modificare viitoare
# strică una din formulele testate (achitare parțială, consolidare comisioane, formatare
# cantități), apare un X roșu pe commit, pe GitHub, în loc să treacă neobservat.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul
        uses: actions/checkout@v4

      - name: Pregătește Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Testele nu au nicio dependință externă (folosesc doar test runner-ul inclus în Node) —
      # nu e nevoie de "npm install", rulează direct, în câteva secunde. Calea e scrisă explicit
      # (nu ca tipar cu *), ca să nu depindă de cum interpretează fiecare versiune de Node
      # expansiunea de "glob" — un singur fișier de test acum, ușor de extins mai târziu.
      - name: Rulează testele
      run: node --test tests/pangarFinanciar.test.mjs tests/jurnalFinanciar.test.mjs
